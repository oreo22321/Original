# Render の設定 (Blueprint)
#  forgecode-live: 実機連携の中継サーバー (Delta などのエグゼキューターと ForgeCode をつなぐ)。無料プランで動きます
#  forgecode     : ForgeCode 本体を Render で公開したい場合の静的サイト (GitHub Pages で使うなら不要)
services:
  - type: web
    name: forgecode-live
    runtime: node
    plan: free
    buildCommand: echo "ビルドは不要です"
    startCommand: node relay/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
  - type: web
    name: forgecode
    runtime: static
    buildCommand: echo "ビルドは不要です"
    staticPublishPath: .
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
