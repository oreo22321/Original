# Render の設定 (Blueprint)
#  forgecode-live: 実機連携の中継サーバー (Delta などのエグゼキューターと ForgeCode をつなぐ)。無料プランで動きます
#                  ForgeCode 本体も同じ場所で配信するので、その URL を開けば設定なしで実機とつながります
services:
  - type: web
    name: forgecode-live
    runtime: node
    plan: free
    buildCommand: echo "ビルドは不要です"
    startCommand: node relay/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
